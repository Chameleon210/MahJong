<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻將戰績分析系統</title>
<style>
:root{
  --bg:#0a0f14;
  --panel:#121b24;
  --panel2:#182430;
  --line:#243444;
  --text:#e8f0f8;
  --muted:#7f93a8;
  --accent:#39d98a;
  --accent2:#ffc93c;
  --danger:#ff5c72;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(1200px 600px at 15% -10%,#16324a 0%,transparent 60%),
             radial-gradient(900px 500px at 90% 0%,#1d2b1a 0%,transparent 55%),var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:24px 16px 80px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1120px;margin:0 auto}

/* ---------- Top bar ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;gap:14px;align-items:center}
.logo{
  width:54px;height:54px;border-radius:16px;flex:none;
  background:linear-gradient(145deg,#1f6b4a,#0e3a28);
  display:grid;place-items:center;font-size:26px;
  border:1px solid #2f8a63;box-shadow:0 0 26px rgba(57,217,138,.28);
}
h1{font-size:20px;letter-spacing:.5px;font-weight:800}
.sub{font-size:10px;color:var(--muted);letter-spacing:2.4px;margin-top:3px}
.tabs{display:flex;gap:5px;background:var(--panel);padding:6px;border-radius:15px;border:1px solid var(--line);flex-wrap:wrap}
.tab{
  border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:10px;
  cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:.18s;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#052015;box-shadow:0 4px 18px rgba(57,217,138,.3)}

/* ---------- Panels ---------- */
.tab-panel{display:none;animation:fade .25s ease}
.tab-panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{
  background:linear-gradient(160deg,#121b24,#0e161d);
  border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;
}
.panel h2{
  font-size:12px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;
  margin-bottom:16px;font-weight:800;
}
.panel-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons ---------- */
.btn{
  font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;
  font-weight:800;font-size:14px;transition:.16s;
}
.btn-primary{background:var(--accent);color:#04251a}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 16px;font-size:13px}
.btn-danger-ghost:hover{color:var(--danger);border-color:var(--danger)}

/* ---------- Avatar ---------- */
.avatar{border-radius:50%;object-fit:cover;display:block;border:2px solid rgba(255,255,255,.14);flex:none;background:#0d151c}
.avatar.letter{display:grid;place-items:center;font-weight:800;color:#06231a;border:0;text-transform:uppercase}
.avatar.empty{display:grid;place-items:center;font-weight:800;color:var(--muted);background:#0d151c;border:2px dashed var(--line)}

/* ---------- Add player ---------- */
.add-form{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.avatar-picker{
  width:66px;height:66px;border-radius:50%;background:var(--panel2);border:2px dashed var(--line);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;font-size:26px;color:var(--muted);
  transition:.2s;
}
.avatar-picker:hover{border-color:var(--accent);color:var(--accent)}
.avatar-picker img{width:100%;height:100%;object-fit:cover;border-radius:50%}
input[type=text],input[type=number]{
  background:#0d151c;border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:12px 15px;font-family:inherit;font-size:14px;outline:none;transition:.16s;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,217,138,.12)}
#pName{flex:1;min-width:180px}

/* ---------- Player grid ---------- */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.player-card{
  display:flex;align-items:center;gap:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:14px;padding:12px;transition:.18s;
}
.player-card:hover{border-color:#2f8a63}
.player-card .info{flex:1;min-width:0}
.player-card .pname{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-card .pmeta{font-size:11.5px;color:var(--muted);margin-top:3px}
.icon-btn{
  background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:15px;
  padding:7px 8px;border-radius:9px;transition:.16s;flex:none;
}
.icon-btn:hover{color:var(--danger);background:rgba(255,92,114,.12)}

/* ---------- Mode picker ---------- */
.mode-picker{display:flex;gap:12px;flex-wrap:wrap}
.mode-btn{
  flex:1;min-width:150px;background:var(--panel2);border:2px solid var(--line);color:var(--text);
  border-radius:15px;padding:18px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;
  transition:.2s;display:flex;flex-direction:column;gap:5px;align-items:center;
}
.mode-btn small{font-size:10.5px;color:var(--muted);letter-spacing:1.6px;font-weight:700}
.mode-btn:hover{border-color:#2f8a63}
.mode-btn.active{border-color:var(--accent);background:rgba(57,217,138,.1);box-shadow:0 0 0 4px rgba(57,217,138,.09)}
.mode-btn.active small{color:var(--accent)}

/* ---------- Seats ---------- */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.seat{
  background:var(--panel2);border:1px solid var(--line);border-radius:15px;
  padding:16px 13px 13px;text-align:center;position:relative;transition:.18s;
}
.seat:hover{border-color:#2f8a63}
.wind{
  position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;color:var(--accent2);
  background:rgba(255,201,60,.12);border-radius:7px;padding:2px 8px;letter-spacing:1px;
}
.seat .avatar{margin:12px auto 11px}
.seat select{
  width:100%;background:#0d151c;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:9px;font-family:inherit;font-size:13px;outline:none;cursor:pointer;
}
.seat select:focus{border-color:var(--accent)}

/* ---------- Fields ---------- */
.field{margin-bottom:20px}
.field > label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:2px solid var(--line);
  color:var(--text);border-radius:99px;padding:6px 18px 6px 6px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;transition:.16s;
}
.chip:hover{border-color:#2f8a63}
.chip.sel{border-color:var(--accent);background:rgba(57,217,138,.13);color:var(--accent)}
.chip.sel.danger{border-color:var(--danger);background:rgba(255,92,114,.13);color:var(--danger)}
.han-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#hanInput{width:96px;text-align:center;font-size:17px;font-weight:800}
.quick-han{display:flex;gap:7px;flex-wrap:wrap}
.quick-han button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 12px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:700;transition:.15s;
}
.quick-han button:hover{border-color:var(--accent);color:var(--accent)}
.wintype{display:flex;gap:10px;flex-wrap:wrap}
.wintype-btn{
  flex:1;min-width:130px;background:var(--panel2);border:2px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.16s;
}
.wintype-btn:hover{border-color:#2f8a63}
.wintype-btn.active{border-color:var(--accent);background:rgba(57,217,138,.12);color:var(--accent)}

/* ---------- Stats ---------- */
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.ov{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:14px 16px}
.ov span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
.ov b{font-size:25px;font-variant-numeric:tabular-nums;font-weight:800}
.stat-card{
  background:linear-gradient(160deg,#121b24,#0e161d);border:1px solid var(--line);
  border-radius:18px;padding:18px;margin-bottom:14px;
}
.stat-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.stat-head .who{flex:1;min-width:0}
.stat-head .pname{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-head .pmeta{font-size:12px;color:var(--muted);margin-top:4px}
.rank{font-size:20px;font-weight:800;color:var(--accent2);flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#0d151c;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.stat .label{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.stat .value{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:600}
.bar-row .bl{width:48px;flex:none}
.bar{flex:1;height:9px;background:#0d151c;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#39d98a,#22d3ee);transition:width .55s cubic-bezier(.4,0,.2,1)}
.bar.danger i{background:linear-gradient(90deg,#ff5c72,#ff9f43)}
.bar-row .bv{width:54px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}

/* ---------- History ---------- */
.rec{
  display:flex;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:15px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap;transition:.16s;
}
.rec:hover{border-color:#2f8a63}
.rec-no{font-weight:800;color:var(--muted);font-size:13px;min-width:36px;font-variant-numeric:tabular-nums}
.rec-seats{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:200px}
.seat-tag{
  display:flex;align-items:center;gap:6px;background:#0d151c;border:1px solid var(--line);
  border-radius:99px;padding:3px 11px 3px 3px;font-size:12.5px;font-weight:700;
}
.seat-tag i{font-style:normal;font-weight:800;color:var(--accent2);font-size:10.5px}
.seat-tag.win{border-color:var(--accent);background:rgba(57,217,138,.12);color:var(--accent)}
.rec-info{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:#0d151c;letter-spacing:.3px}
.badge.gold{color:var(--accent2);border-color:rgba(255,201,60,.4);background:rgba(255,201,60,.1)}
.badge.green{color:var(--accent);border-color:rgba(57,217,138,.4);background:rgba(57,217,138,.1)}
.badge.red{color:var(--danger);border-color:rgba(255,92,114,.4);background:rgba(255,92,114,.1)}
.badge.dim{color:var(--muted)}

/* ---------- Misc ---------- */
.empty{
  text-align:center;color:var(--muted);padding:38px 16px;font-size:14px;line-height:2;
  border:1px dashed var(--line);border-radius:15px;
}
.empty span{font-size:12.5px;opacity:.75}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,24px);
  background:#1b2a36;border:1px solid var(--line);color:var(--text);padding:13px 24px;
  border-radius:13px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.4,0,.2,1);z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  body{padding:16px 12px 70px}
  h1{font-size:17px}
  .tabs{width:100%;justify-content:space-between}
  .tab{padding:9px 10px;font-size:13px;flex:1;text-align:center}
  .panel{padding:16px;border-radius:16px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">🀄</div>
      <div>
        <h1>麻將戰績分析</h1>
        <p class="sub">MAHJONG PERFORMANCE TRACKER</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="players">玩家</button>
      <button class="tab" data-tab="play">開始對局</button>
      <button class="tab" data-tab="stats">數據統計</button>
      <button class="tab" data-tab="history">對局紀錄</button>
    </nav>
  </header>

  <main>
    <!-- ================= 玩家 ================= -->
    <section id="tab-players" class="tab-panel active">
      <div class="panel">
        <h2>新增玩家</h2>
        <div class="add-form">
          <label class="avatar-picker" for="pAvatar" id="avatarPreview"><span>＋</span></label>
          <input type="file" id="pAvatar" accept="image/*" hidden>
          <input type="text" id="pName" placeholder="輸入玩家名字（最多 12 字）" maxlength="12">
          <button class="btn btn-primary" id="addPlayerBtn">＋ 新增玩家</button>
        </div>
      </div>
      <div class="panel">
        <h2>玩家名單</h2>
        <div class="player-grid" id="playerGrid"></div>
      </div>
      <div class="panel-actions" style="justify-content:flex-end">
        <button class="btn btn-danger-ghost" id="resetAll">🗑 清除所有資料</button>
      </div>
    </section>

    <!-- ================= 開始對局 ================= -->
    <section id="tab-play" class="tab-panel">
      <div class="panel">
        <h2>① 選擇人數</h2>
        <div class="mode-picker">
          <button class="mode-btn" data-mode="3">三人麻將<small>3 PLAYERS</small></button>
          <button class="mode-btn" data-mode="4">四人麻將<small>4 PLAYERS</small></button>
        </div>
      </div>

      <div class="panel" id="seatPanel" style="display:none">
        <h2>② 選擇玩家與座位</h2>
        <div class="seats" id="seats"></div>
        <div class="panel-actions">
          <button class="btn btn-ghost" id="toResult" disabled>下一步：記錄結果 ↓</button>
        </div>
      </div>

      <div class="panel" id="resultPanel" style="display:none">
        <h2>③ 記錄本局結果</h2>

        <div class="field">
          <label>誰是贏家？</label>
          <div class="chips" id="winnerChips"></div>
        </div>

        <div class="field">
          <label>獲得番數</label>
          <div class="han-row">
            <input type="number" id="hanInput" value="1" min="1" step="1">
            <div class="quick-han" id="quickHan"></div>
          </div>
        </div>

        <div class="field">
          <label>勝利方式</label>
          <div class="wintype">
            <button class="wintype-btn active" data-type="tsumo">🀄 自摸</button>
            <button class="wintype-btn" data-type="ron">💥 榮和（點炮）</button>
          </div>
        </div>

        <div class="field" id="loserWrap" style="display:none">
          <label>誰點的炮？</label>
          <div class="chips" id="loserChips"></div>
        </div>

        <div class="panel-actions">
          <button class="btn btn-primary" id="submitRecord">✅ 記錄本局</button>
        </div>
      </div>
    </section>

    <!-- ================= 數據統計 ================= -->
    <section id="tab-stats" class="tab-panel">
      <div id="statsArea"></div>
    </section>

    <!-- ================= 對局紀錄 ================= -->
    <section id="tab-history" class="tab-panel">
      <div class="panel">
        <h2>對局紀錄（最新在上）</h2>
        <div id="historyArea"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================================================
   資料層
====================================================== */
const KEY = 'mahjong-tracker-v1';
const COLORS = ['#39d98a','#4ea8ff','#ffc93c','#ff7a9a','#a78bfa','#ff9f43','#22d3ee','#f472b6','#84cc16','#f87171'];
const WINDS = ['東','南','西','北'];

let state = { players: [], records: [] };
let ui = { mode: 0, seats: [], winnerId: null, loserId: null, winType: 'tsumo', han: 1 };
let pendingAvatar = null;

/* ======================================================
   工具
====================================================== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n){
  const r = Math.round(n * 10) / 10;
  return (Number.isInteger(r) ? r : r.toFixed(1));
}
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function getPlayer(id){
  return state.players.find(p => p.id === id) || { id, name: '已刪除玩家', avatar: null, color: '#556677' };
}
function avatarHTML(p, size){
  if (p.avatar){
    return `<img class="avatar" style="width:${size}px;height:${size}px" src="${p.avatar}" alt="">`;
  }
  const ch = (p.name || '?').trim().charAt(0) || '?';
  return `<div class="avatar letter" style="width:${size}px;height:${size}px;background:${p.color || '#39d98a'};font-size:${Math.round(size*0.42)}px">${esc(ch)}</div>`;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('儲存失敗', e); }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    state.players = Array.isArray(d.players) ? d.players : [];
    state.records = Array.isArray(d.records) ? d.records : [];
  }catch(e){ console.warn('讀取失敗', e); }
}

/* ======================================================
   統計計算
====================================================== */
function computeStats(id){
  const s = { games:0, wins:0, totalHan:0, dealIns:0, tsumo:0, ron:0,
              winRate:0, dealInRate:0, avgHan:0 };
  state.records.forEach(r => {
    if (!r.seats.includes(id)) return;
    s.games++;
    if (r.winnerId === id){
      s.wins++;
      s.totalHan += r.han;
      if (r.winType === 'tsumo') s.tsumo++; else s.ron++;
    }
    if (r.winType === 'ron' && r.loserId === id) s.dealIns++;
  });
  s.winRate    = s.games ? (s.wins / s.games) * 100 : 0;
  s.dealInRate = s.games ? (s.dealIns / s.games) * 100 : 0;
  s.avgHan     = s.wins ? s.totalHan / s.wins : 0;
  return s;
}

/* ======================================================
   頁籤
====================================================== */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'play'){ renderSeats(); renderResult(); }
  if (name === 'stats') renderStats();
  if (name === 'history') renderHistory();
}

/* ======================================================
   玩家管理
====================================================== */
function renderPlayers(){
  const grid = $('playerGrid');
  if (!state.players.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">還沒有玩家<br><span>點擊左側「＋」上傳頭像，輸入名字後新增</span></div>`;
    return;
  }
  grid.innerHTML = state.players.map(p => {
    const s = computeStats(p.id);
    return `<div class="player-card">
      ${avatarHTML(p, 48)}
      <div class="info">
        <div class="pname">${esc(p.name)}</div>
        <div class="pmeta">${s.games} 場 · 勝率 ${fmt(s.winRate)}% · 總番 ${s.totalHan}</div>
      </div>
      <button class="icon-btn" data-del-player="${p.id}" title="刪除玩家">✕</button>
    </div>`;
  }).join('');
}

$('playerGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-del-player]');
  if (!b) return;
  const id = b.dataset.delPlayer;
  const p = getPlayer(id);
  if (!confirm(`確定要刪除玩家「${p.name}」嗎？\n（已記錄的對局仍會保留）`)) return;
  state.players = state.players.filter(x => x.id !== id);
  ui.seats = ui.seats.map(s => s === id ? '' : s);
  if (ui.winnerId === id) ui.winnerId = null;
  if (ui.loserId === id) ui.loserId = null;
  save();
  renderAll();
  toast('已刪除玩家');
});

$('pAvatar').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 180;
      const cv = document.createElement('canvas');
      cv.width = cv.height = SIZE;
      const ctx = cv.getContext('2d');
      const scale = Math.max(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      pendingAvatar = cv.toDataURL('image/jpeg', 0.85);
      $('avatarPreview').innerHTML = `<img src="${pendingAvatar}" alt="">`;
    };
    img.onerror = () => toast('圖片讀取失敗');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

$('addPlayerBtn').addEventListener('click', addPlayer);
$('pName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

function addPlayer(){
  const name = $('pName').value.trim();
  if (!name) return toast('請先輸入玩家名字');
  if (state.players.some(p => p.name === name)) return toast('已經有同名玩家了');
  state.players.push({
    id: uid(),
    name,
    avatar: pendingAvatar,
    color: COLORS[state.players.length % COLORS.length]
  });
  pendingAvatar = null;
  $('pName').value = '';
  $('pAvatar').value = '';
  $('avatarPreview').innerHTML = '<span>＋</span>';
  save();
  renderAll();
  toast('✅ 已新增玩家：' + name);
}

$('resetAll').addEventListener('click', () => {
  if (!confirm('確定要清除「所有玩家」與「所有對局紀錄」嗎？此操作無法復原。')) return;
  state = { players: [], records: [] };
  ui.seats = []; ui.winnerId = null; ui.loserId = null;
  save();
  renderAll();
  toast('已清除所有資料');
});

/* ======================================================
   模式 & 座位
====================================================== */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(Number(btn.dataset.mode)));
});

function setMode(n){
  ui.mode = n;
  ui.seats = new Array(n).fill('');
  ui.winnerId = null;
  ui.loserId = null;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.mode) === n));
  renderSeats();
  renderResult();
}

function renderSeats(){
  const panel = $('seatPanel');
  const wrap = $('seats');
  const btn = $('toResult');

  if (!ui.mode){ panel.style.display = 'none'; return; }
  panel.style.display = '';

  while (ui.seats.length < ui.mode) ui.seats.push('');
  ui.seats.length = ui.mode;

  if (state.players.length < ui.mode){
    wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">玩家不足 ${ui.mode} 人<br><span>請先到「玩家」頁籤新增玩家</span></div>`;
    btn.disabled = true;
    return;
  }

  wrap.innerHTML = ui.seats.map((pid, i) => {
    const p = pid ? getPlayer(pid) : null;
    const opts = ['<option value="">— 選擇玩家 —</option>'].concat(
      state.players.map(pl => {
        const takenByOther = ui.seats.some((s, j) => j !== i && s === pl.id);
        return `<option value="${pl.id}" ${takenByOther ? 'disabled' : ''} ${pid === pl.id ? 'selected' : ''}>
          ${esc(pl.name)}${takenByOther ? '（已入座）' : ''}
        </option>`;
      })
    ).join('');

    return `<div class="seat">
      <div class="wind">${WINDS[i]}</div>
      <div>${p ? avatarHTML(p, 62) : `<div class="avatar empty" style="width:62px;height:62px;font-size:24px">?</div>`}</div>
      <select data-seat="${i}">${opts}</select>
    </div>`;
  }).join('');

  const complete = ui.seats.every(Boolean) && new Set(ui.seats).size === ui.mode;
  btn.disabled = !complete;
}

$('seats').addEventListener('change', e => {
  const sel = e.target.closest('select[data-seat]');
  if (!sel) return;
  const i = Number(sel.dataset.seat);
  ui.seats[i] = sel.value;
  if (!ui.seats.includes(ui.winnerId)) ui.winnerId = null;
  if (!ui.seats.includes(ui.loserId)) ui.loserId = null;
  renderSeats();
  renderResult();
});

$('toResult').addEventListener('click', () => {
  $('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* ======================================================
   結果記錄
====================================================== */
const QUICK_HAN = [1, 2, 3, 4, 5, 6, 8, 10, 13, 16, 20];
$('quickHan').innerHTML = QUICK_HAN.map(h => `<button data-han="${h}">${h} 番</button>`).join('');

$('quickHan').addEventListener('click', e => {
  const b = e.target.closest('[data-han]');
  if (!b) return;
  ui.han = Number(b.dataset.han);
  $('hanInput').value = ui.han;
});

$('hanInput').addEventListener('input', () => {
  ui.han = Math.max(1, parseInt($('hanInput').value, 10) || 1);
});

document.querySelectorAll('.wintype-btn').forEach(b => {
  b.addEventListener('click', () => {
    ui.winType = b.dataset.type;
    if (ui.winType === 'tsumo') ui.loserId = null;
    renderResult();
  });
});

function chipHTML(p, selected, cls = ''){
  return `<button class="chip ${selected ? 'sel' : ''} ${cls}" data-pid="${p.id}">
    ${avatarHTML(p, 34)}<span>${esc(p.name)}</span>
  </button>`;
}

function renderResult(){
  const panel = $('resultPanel');
  const seats = ui.seats.filter(Boolean);
  const complete = ui.mode && seats.length === ui.mode && new Set(seats).size === ui.mode;

  if (!complete){ panel.style.display = 'none'; return; }
  panel.style.display = '';

  const players = ui.seats.map(getPlayer);
  if (!ui.seats.includes(ui.winnerId)) ui.winnerId = null;
  if (!ui.seats.includes(ui.loserId)) ui.loserId = null;

  // 贏家
  $('winnerChips').innerHTML = players.map(p =>
    chipHTML(p, ui.winnerId === p.id)).join('');

  // 勝利方式
  document.querySelectorAll('.wintype-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.type === ui.winType));

  // 點炮者
  const loserWrap = $('loserWrap');
  if (ui.winType === 'ron'){
    loserWrap.style.display = '';
    $('loserChips').innerHTML = players
      .filter(p => p.id !== ui.winnerId)
      .map(p => chipHTML(p, ui.loserId === p.id, 'danger'))
      .join('');
  } else {
    loserWrap.style.display = 'none';
  }

  const hi = $('hanInput');
  if (document.activeElement !== hi) hi.value = ui.han;
}

$('winnerChips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  ui.winnerId = b.dataset.pid;
  if (ui.loserId === ui.winnerId) ui.loserId = null;
  renderResult();
});

$('loserChips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  ui.loserId = b.dataset.pid;
  renderResult();
});

$('submitRecord').addEventListener('click', submitRecord);

function submitRecord(){
  const seats = ui.seats.filter(Boolean);
  if (!ui.mode || seats.length !== ui.mode || new Set(seats).size !== ui.mode)
    return toast('請先選好所有座位');
  if (!ui.winnerId) return toast('請選擇本局的贏家');
  const han = Math.max(1, parseInt($('hanInput').value, 10) || 0);
  if (!han) return toast('請輸入番數（至少 1 番）');
  if (ui.winType === 'ron' && !ui.loserId) return toast('請選擇是哪位玩家點炮');

  state.records.push({
    id: uid(),
    mode: ui.mode,
    seats: [...ui.seats],
    winnerId: ui.winnerId,
    han,
    winType: ui.winType,
    loserId: ui.winType === 'ron' ? ui.loserId : null,
    ts: Date.now()
  });
  save();

  const winName = getPlayer(ui.winnerId).name;
  toast(`✅ 已記錄：${winName} ${ui.winType === 'tsumo' ? '自摸' : '榮和'} ${han} 番`);

  ui.winnerId = null;
  ui.loserId = null;
  ui.winType = 'tsumo';
  ui.han = 1;
  $('hanInput').value = 1;

  renderResult();
  renderPlayers();
  renderStats();
  renderHistory();
}

/* ======================================================
   數據統計
====================================================== */
function renderStats(){
  const area = $('statsArea');
  const totalHan = state.records.reduce((a, r) => a + r.han, 0);

  if (!state.players.length){
    area.innerHTML = `<div class="panel"><div class="empty">還沒有玩家資料<br><span>先到「玩家」頁籤新增玩家吧</span></div></div>`;
    return;
  }

  const rows = state.players.map(p => ({ p, s: computeStats(p.id) }));
  rows.sort((a, b) =>
    b.s.winRate - a.s.winRate ||
    b.s.totalHan - a.s.totalHan ||
    b.s.games - a.s.games
  );

  area.innerHTML = `
    <div class="overview">
      <div class="ov"><span>總對局數</span><b>${state.records.length}</b></div>
      <div class="ov"><span>玩家數</span><b>${state.players.length}</b></div>
      <div class="ov"><span>累積總番數</span><b>${totalHan}</b></div>
    </div>
    ${rows.map((r, i) => statCardHTML(r.p, r.s, i)).join('')}
  `;
}

function statCardHTML(p, s, i){
  const medal = s.games === 0 ? `#${i + 1}` : (['🥇','🥈','🥉'][i] || `#${i + 1}`);
  return `<div class="stat-card">
    <div class="stat-head">
      ${avatarHTML(p, 58)}
      <div class="who">
        <div class="pname">${esc(p.name)}</div>
        <div class="pmeta">${s.games} 場 · 平均每勝 ${fmt(s.avgHan)} 番</div>
      </div>
      <div class="rank">${medal}</div>
    </div>

    <div class="stat-grid">
      <div class="stat"><span class="label">總番數</span><span class="value">${s.totalHan}</span></div>
      <div class="stat"><span class="label">遊玩場次</span><span class="value">${s.games}</span></div>
      <div class="stat"><span class="label">勝局數</span><span class="value">${s.wins}</span></div>
      <div class="stat"><span class="label">勝率</span><span class="value">${fmt(s.winRate)}%</span></div>
      <div class="stat"><span class="label">點炮次數</span><span class="value">${s.dealIns}</span></div>
      <div class="stat"><span class="label">點炮率</span><span class="value">${fmt(s.dealInRate)}%</span></div>
      <div class="stat"><span class="label">自摸 / 榮和</span><span class="value">${s.tsumo} / ${s.ron}</span></div>
      <div class="stat"><span class="label">平均每勝番數</span><span class="value">${fmt(s.avgHan)}</span></div>
    </div>

    <div class="bars">
      <div class="bar-row">
        <span class="bl">勝率</span>
        <div class="bar"><i style="width:${Math.min(100, s.winRate)}%"></i></div>
        <span class="bv">${fmt(s.winRate)}%</span>
      </div>
      <div class="bar-row">
        <span class="bl">點炮率</span>
        <div class="bar danger"><i style="width:${Math.min(100, s.dealInRate)}%"></i></div>
        <span class="bv">${fmt(s.dealInRate)}%</span>
      </div>
    </div>
  </div>`;
}

/* ======================================================
   對局紀錄
====================================================== */
function renderHistory(){
  const area = $('historyArea');
  if (!state.records.length){
    area.innerHTML = `<div class="empty">還沒有對局紀錄<br><span>到「開始對局」頁籤記錄第一局吧</span></div>`;
    return;
  }

  const list = state.records.map((r, i) => ({ r, no: i + 1 })).reverse();

  area.innerHTML = list.map(({ r, no }) => {
    const seats = r.seats.map((pid, i) => {
      const p = getPlayer(pid);
      const win = pid === r.winnerId;
      return `<span class="seat-tag ${win ? 'win' : ''}">
        ${avatarHTML(p, 22)}<i>${WINDS[i]}</i>${esc(p.name)}${win ? ' 🏆' : ''}
      </span>`;
    }).join('');

    const loser = r.winType === 'ron' ? getPlayer(r.loserId) : null;

    return `<div class="rec">
      <div class="rec-no">#${no}</div>
      <div class="rec-seats">${seats}</div>
      <div class="rec-info">
        <span class="badge gold">${r.han} 番</span>
        <span class="badge ${r.winType === 'tsumo' ? 'green' : 'red'}">${r.winType === 'tsumo' ? '自摸' : '榮和'}</span>
        ${loser ? `<span class="badge red">放銃：${esc(loser.name)}</span>` : ''}
        <span class="badge dim">${r.mode} 人</span>
      </div>
      <button class="icon-btn" data-del-rec="${r.id}" title="刪除紀錄">✕</button>
    </div>`;
  }).join('');
}

$('historyArea').addEventListener('click', e => {
  const b = e.target.closest('[data-del-rec]');
  if (!b) return;
  if (!confirm('確定刪除這筆對局紀錄？')) return;
  state.records = state.records.filter(x => x.id !== b.dataset.delRec);
  save();
  renderHistory();
  renderStats();
  renderPlayers();
  toast('已刪除紀錄');
});

/* ======================================================
   初始化
====================================================== */
function renderAll(){
  renderPlayers();
  renderSeats();
  renderResult();
  renderStats();
  renderHistory();
}

document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => switchTab(t.dataset.tab)));

load();
renderAll();
switchTab(state.players.length ? 'play' : 'players');
</script>
</body>
</html>
